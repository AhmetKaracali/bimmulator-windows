# Copy to idrive6.toml (wsl/setup.sh writes one) and set psdzdata to your extracted PSdZData.
psdzdata = "/path/to/psdzdata"

# ECUs to start. The 6WB cluster/HUD is upstream's experimental module (HU 007.030.001 era).
modules = ["head-unit"]

# Optional: force a build from builds/ instead of detecting it from the package hashes.
# build = "hu-006.027.001"

# Optional: emulator profile from builds/<id>/profiles/ (default: the build's default_profile).
# profile = "f30-id6-light"

# Optional. Defaults to $XDG_CACHE_HOME/idrive6 or ~/.cache/idrive6.
# cacheDir = "/path/to/idrive6-cache"

# Optional: gtk (WSL2/Linux default), sdl, cocoa (macOS) or none for headless runs.
# display = "gtk"

# Optional: 2 (default) or 1 for the slower single-core compatibility mode.
# cpuCount = 2
